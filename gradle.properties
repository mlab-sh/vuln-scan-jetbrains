pluginVersion=1.1.0
# Oldest IDE line supported. Compiling against it keeps us off newer-only APIs;
# the verifier checks the newer lines.
platformVersion=2024.3.6
pluginSinceBuild=243

# The IDE ships its own Kotlin stdlib; bundling another is a Marketplace red flag.
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
